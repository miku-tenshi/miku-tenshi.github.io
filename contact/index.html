<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>(function(){try{var T=["default","dark","blue","mint","pink"];var t=localStorage.getItem("mt-theme");if(T.indexOf(t)===-1){t="blue";localStorage.setItem("mt-theme",t);}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>contact/ — miku-tenshi</title>
<meta name="description" content="연락처">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar-mount"></aside>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/sidebar.js"></script>

  <main class="main">
    <div class="main-heading">
      <h1>contact/</h1>
      <p>연락할 수 있는 곳들.</p>
    </div>

    <article class="window" id="window">
      <div class="window-chrome">
        <div class="chrome-dots"><span></span><span></span><span></span></div>
        <span class="chrome-path"><a href="/contact/">contact</a> / links.md</span>
        <span class="chrome-hint">click to focus &rarr;</span>
      </div>
      <div class="window-body" id="window-body">

        <div class="entry-date">links</div>
        <h2>연락처</h2>
        <p>편하게 연락 주세요.</p>
        <div class="entry-list">
          <a class="entry-list-item clickable" href="https://github.com/miku-tenshi"><span class="t"><span class="file-icon"></span>GitHub</span><span class="d">@miku-tenshi</span></a>
          <a class="entry-list-item clickable" href="mailto:you@example.com"><span class="t"><span class="file-icon"></span>Email</span><span class="d">you@example.com</span></a>
          <a class="entry-list-item clickable" href="https://blog.example.com"><span class="t"><span class="file-icon"></span>Blog</span><span class="d">blog.example.com</span></a>
        </div>
      </div>
    </article>
  </main>

</div>

<div class="backdrop" id="backdrop"></div>

<script src="/assets/js/window.js"></script>
</body>
</html>
