<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>(function(){try{var T=["default","dark","blue","mint","pink"];var t=localStorage.getItem("mt-theme");if(T.indexOf(t)===-1){t=T[Math.floor(Math.random()*T.length)];localStorage.setItem("mt-theme",t);}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>miku-tenshi — chaerim</title>
<meta name="description" content="limi's study & dev note">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar-mount"></aside>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/sidebar.js"></script>

  <main class="main">
    <div class="main-heading">
      <h1>home/</h1>
      <p>chaerimi의 기록 공간입니다.</p>
    </div>

    <!--HOME 내용-->
      <article class="window" id="window"> 
        <div class="window-chrome">
          <div class="chrome-dots"><span></span><span></span><span></span></div>
          <span class="chrome-path">home / index.md</span>
          <span class="chrome-hint">click to focus &rarr;</span>
        </div>
        <div class="window-body" id="window-body">

          <div class="entry-date">welcome</div>
          <h2>Introduce - リミ's page</h2>
          <p>공부하며 배운 것들을 기록하고, 만든 프로젝트를 정리하는 공간입니다.
          아래 항목을 눌러 둘러보세요. 메뉴 하나하나가 실제 폴더이고, 그 안에 또 폴더가
          있을 수도 있습니다 &mdash; 왼쪽 위 경로 표시(breadcrumb)를 따라가면 지금 어디에 있는지 알 수 있어요.<br></p>
          
                <!-- 최근 글 — study/project 등 모든 섹션의 글을 날짜순으로 모아 보여준다.
          /posts.json 을 읽어서 렌더링하며, 5개 초과분은 번호 페이지네이션으로 넘어간다.
          /write/ 에서 글을 올리거나 고치거나 지우면 posts.json도 함께 갱신된다. -->
            <h4>최근 글</h4> 
            <p id="recent-empty" style="display:none;">아직 작성된 글이 없어요. <a href="/private/write/">write</a>에서 첫 글을 올려보세요.</p>
            <div class="entry-list" id="recent-list"></div>
            <div class="pagination" id="recent-pagination"></div>
        </div>
      </article>
  </main>

</div>

<div class="backdrop" id="backdrop"></div>

<script src="/assets/js/window.js"></script>
<script>
(function(){
  const PAGE_SIZE = 10;
  const listEl = document.getElementById('recent-list');
  const pagEl = document.getElementById('recent-pagination');
  const emptyEl = document.getElementById('recent-empty');
  let posts = [];
  let page = 1;

  function esc(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function render(){
    const totalPages = Math.max(1, Math.ceil(posts.length / PAGE_SIZE));
    if (page > totalPages) page = totalPages;
    const start = (page - 1) * PAGE_SIZE;
    const slice = posts.slice(start, start + PAGE_SIZE);

    listEl.innerHTML = slice.map((p) =>
      '<a class="entry-list-item clickable" href="' + p.href + '">' +
        '<span class="t"><span class="file-icon"></span>' + esc(p.title) + '</span>' +
        '<span class="d">' + esc(p.meta || '') + '</span>' +
      '</a>'
    ).join('');

    emptyEl.style.display = posts.length ? 'none' : '';
    listEl.style.display = posts.length ? '' : 'none';

    if (totalPages <= 1){ pagEl.innerHTML = ''; return; }
    let html = '<button class="page-btn" data-page="prev"' + (page === 1 ? ' disabled' : '') + '>&larr;</button>';
    for (let i = 1; i <= totalPages; i++){
      html += '<button class="page-btn' + (i === page ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
    }
    html += '<button class="page-btn" data-page="next"' + (page === totalPages ? ' disabled' : '') + '>&rarr;</button>';
    pagEl.innerHTML = html;
  }

  pagEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.page-btn');
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(posts.length / PAGE_SIZE));
    const val = btn.dataset.page;
    if (val === 'prev') page = Math.max(1, page - 1);
    else if (val === 'next') page = Math.min(totalPages, page + 1);
    else page = parseInt(val, 10);
    render();
  });

  fetch('/posts.json').then((r) => r.ok ? r.json() : []).then((data) => {
    posts = Array.isArray(data) ? data.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')) : [];
    render();
  }).catch(() => { posts = []; render(); });
})();
</script>
</body>
</html>
