<!DOCTYPE html>

<script>(function(){try{var T=["default","aurora","blue","pink"];var C={default:"#f5f6f8",aurora:"#f2edfc",blue:"#e1f0fb",pink:"#fbe9f1"};var t=localStorage.getItem("mt-theme");if(T.indexOf(t)===-1){t="default";localStorage.setItem("mt-theme",t);}document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(!m){m=document.createElement("meta");m.setAttribute("name","theme-color");document.head.appendChild(m);}m.setAttribute("content",C[t]);}catch(e){}})();</script>

</head>
