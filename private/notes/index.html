<!DOCTYPE html>
<html lang="ko" class="private-pending">
<head>
<meta charset="UTF-8">
<script>(function(){try{var T=["default","dark","blue","mint","pink"];var C={default:"#f5f6f8",dark:"#191c24",blue:"#e1f0fb",mint:"#e8f5f4",pink:"#fbe9f1"};var t=localStorage.getItem("mt-theme");if(T.indexOf(t)===-1){t="blue";localStorage.setItem("mt-theme",t);}document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(!m){m=document.createElement("meta");m.setAttribute("name","theme-color");document.head.appendChild(m);}m.setAttribute("content",C[t]);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>notes/ — private — miku-tenshi</title>
<meta name="robots" content="noindex, nofollow">
<style>.private-pending body { visibility: hidden; }</style>
<script src="/assets/js/private-guard.js"></script>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  /* 노트 도구 전용 보조 스타일 — 최대한 site style.css의 .window/.entry-list/.wbtn류를 재사용.
     화면은 항상 세 가지 상태 중 하나만 보인다: 목록(list) / 읽기 전용 상세(detail) / 입력
     폼(form, 새 메모 작성 또는 기존 메모 수정). JS의 setMode()가 이 세 블록의 display를 갈아
     끼운다 — "생성/수정 버튼을 눌러야 입력 칸이 나온다"는 요청이 이 구조의 핵심. */
  .notes-card{ width:100%; max-width:760px; }

  .wbtn{
    display:inline-flex; align-items:center; gap:8px; padding: 11px 20px; border-radius: 20px;
    border:none; cursor:pointer; font-family:inherit; font-size: 14.5px; font-weight:700;
  }
  .wbtn-primary{ background: var(--accent-grad); color:#fff; }
  .wbtn-primary:hover{ filter:brightness(1.05); }
  .wbtn-ghost{ background: var(--accent-soft); color: var(--accent-solid); }
  .wbtn-danger{ background: var(--danger-soft); color: var(--danger); }
  .wbtn:disabled{ opacity:.5; cursor:default; }

  .action-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }

  .status-log{ width:100%; margin-top:14px; }
  .status-log:empty{ display:none; }

  /* ---- 목록 (원래처럼 홈의 "최근 글" 같은 리스트 형태) ---- */
  .notes-empty{ padding: 20px 4px; color: var(--ink-faint); font-size:15px; }

  .note-row{
    display:flex; align-items:baseline; gap: 14px; padding: 14px 4px;
    border-bottom: 1px dashed var(--chrome-border); border-radius:6px; cursor:pointer;
    transition: background 0.15s ease;
  }
  .note-row:hover{ background: rgba(var(--accent-rgb), 0.06); }
  .note-row:last-child{ border-bottom:none; }
  .note-row .n-main{ flex:1; min-width:0; display:flex; align-items:center; gap:10px; }
  .note-row .n-title{
    font-weight:500; color: var(--ink); font-size:16.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .note-row .n-meta{ color: var(--ink-faint); font-size: 14px; white-space:nowrap; }
  .note-row.completed .n-title{ color: var(--ink-faint); text-decoration: line-through; }

  /* 투두 동그라미 — 클릭해도 노트가 열리지 않도록 note-row 클릭 핸들러와 분리해서 처리 */
  .note-todo{
    width:20px; height:20px; flex-shrink:0; border-radius:50%; padding:0; cursor:pointer;
    border: 2px solid var(--ink-faint); background: transparent; box-sizing:border-box;
  }
  .note-todo:hover{ border-color: var(--accent-solid); }
  .note-todo.done{ border-color: transparent; background: var(--accent-grad); position:relative; }
  .note-todo.done::after{
    content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:12px; font-weight:700;
  }

  /* ---- 상세(읽기 전용) ---- */
  .note-detail-title{ font-family: var(--font-pixel); font-size:22px; font-weight:700; margin: 4px 0 6px; }
  .note-detail-meta{ font-size:13px; color: var(--ink-faint); margin-bottom:18px; }
  .note-detail-body{ font-size:16px; line-height:1.85; color: var(--ink); white-space:pre-wrap; word-wrap:break-word; min-height:60px; }

  /* ---- 입력 폼(새 메모 / 수정) ---- */
  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-size: 13.5px; color: var(--ink-faint); margin-bottom: 6px; font-weight:600; }
  .field input[type=text], .field textarea{
    width:100%; box-sizing:border-box; border:1px solid var(--chrome-border); border-radius:10px;
    padding: 10px 13px; font-size: 15.5px; font-family: inherit; background: var(--chrome-bg); color: var(--ink);
  }
  .field input:focus, .field textarea:focus{ outline:2px solid var(--accent-soft); border-color: var(--accent-solid); }
  .field textarea{ resize: vertical; line-height:1.7; min-height: 260px; }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar-mount"></aside>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/sidebar.js"></script>
  <script src="/assets/js/gh-api.js"></script>

  <main class="main">
    <div class="main-heading">
      <h1>private/notes/</h1>
      <p>혼자 보는 메모입니다. /private/ 에서 인증한 세션을 그대로 사용해요 — 여기서 다시 로그인할 필요가 없습니다.</p>
    </div>

    <div class="notes-card">
      <article class="window" id="notes-window" data-no-autofocus>
        <div class="window-chrome">
          <div class="chrome-dots"><span></span><span></span><span></span></div>
          <span class="chrome-path" id="notes-path">notes / list</span>
        </div>
        <div class="window-body" id="notes-body">

          <!-- 상태 1: 목록 -->
          <div id="view-list">
            <div id="notes-list">
              <div class="notes-empty">불러오는 중...</div>
            </div>
            <div class="action-row">
              <button class="wbtn wbtn-primary" id="btn-new">+ 새 메모</button>
            </div>
          </div>

          <!-- 상태 2: 읽기 전용 상세 -->
          <div id="view-detail" style="display:none;">
            <div class="note-detail-title" id="detail-title"></div>
            <div class="note-detail-meta" id="detail-meta"></div>
            <div class="note-detail-body" id="detail-body"></div>
            <div class="action-row">
              <button class="wbtn wbtn-ghost" id="btn-back">← 목록으로</button>
              <button class="wbtn wbtn-primary" id="btn-edit">수정</button>
            </div>
          </div>

          <!-- 상태 3: 입력 폼(새 메모 작성 또는 기존 메모 수정 — btn-delete는 수정 모드에서만 보임) -->
          <div id="view-form" style="display:none;">
            <div class="field">
              <label>제목</label>
              <input type="text" id="n-title" placeholder="메모 제목">
            </div>
            <div class="field">
              <label>내용</label>
              <textarea id="n-body" placeholder="자유롭게 적어두세요."></textarea>
            </div>
            <div class="action-row">
              <button class="wbtn wbtn-primary" id="btn-save">저장</button>
              <button class="wbtn wbtn-danger" id="btn-delete" style="display:none;">삭제</button>
              <button class="wbtn wbtn-ghost" id="btn-cancel">취소</button>
            </div>
            <div class="status-log" id="notes-log"></div>
          </div>

        </div>
      </article>
    </div>
  </main>

</div>

<script src="/assets/js/window.js"></script>
<script src="/assets/js/retro-log.js"></script>
<script>
(function(){
  'use strict';

  const NOTES_PATH = 'private/notes/notes.json';
  const GH_CFG = window.GhApi
    ? GhApi.buildCfgFromSession(SITE_CONFIG.owner, SITE_CONFIG.repo, SITE_CONFIG.branch)
    : null;

  const pathLabel = document.getElementById('notes-path');
  const viewList = document.getElementById('view-list');
  const viewDetail = document.getElementById('view-detail');
  const viewForm = document.getElementById('view-form');
  const listEl = document.getElementById('notes-list');
  const detailTitle = document.getElementById('detail-title');
  const detailMeta = document.getElementById('detail-meta');
  const detailBody = document.getElementById('detail-body');
  const titleInput = document.getElementById('n-title');
  const bodyInput = document.getElementById('n-body');
  const btnNew = document.getElementById('btn-new');
  const btnBack = document.getElementById('btn-back');
  const btnEdit = document.getElementById('btn-edit');
  const btnSave = document.getElementById('btn-save');
  const btnDelete = document.getElementById('btn-delete');
  const btnCancel = document.getElementById('btn-cancel');
  const log = document.getElementById('notes-log');

  let notes = [];
  let notesSha = null;
  let activeId = null; // 상세/수정 중인 노트의 id

  function esc(s){
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fmtDate(iso){
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
  }

  // ---------------------------------------------------------------
  // 화면 상태 전환 — list / detail / form 세 블록 중 하나만 보이게 한다.
  // ---------------------------------------------------------------
  function setMode(mode, note){
    viewList.style.display = mode === 'list' ? '' : 'none';
    viewDetail.style.display = mode === 'detail' ? '' : 'none';
    viewForm.style.display = mode === 'form' ? '' : 'none';

    if (mode === 'list'){
      pathLabel.textContent = 'notes / list';
      activeId = null;
      renderList();
    } else if (mode === 'detail'){
      pathLabel.textContent = 'notes / ' + (note.title || '(제목 없음)');
      detailTitle.textContent = note.title || '(제목 없음)';
      detailMeta.textContent = fmtDate(note.updatedAt) + (note.completed ? '  ·  완료' : '');
      detailBody.textContent = note.body || '';
    } else if (mode === 'form'){
      pathLabel.textContent = 'notes / ' + (note ? '수정' : '새 메모');
      titleInput.value = note ? note.title : '';
      bodyInput.value = note ? note.body : '';
      btnDelete.style.display = note ? '' : 'none';
      log.innerHTML = '';
    }
  }

  function sortedNotes(){
    // 완료 안 한 것 먼저(최신 수정순), 완료한 것은 뒤로 — 투두 리스트처럼 동작
    return notes.slice().sort((a, b) => {
      if (!!a.completed !== !!b.completed) return a.completed ? 1 : -1;
      return (b.updatedAt || '').localeCompare(a.updatedAt || '');
    });
  }

  function renderList(){
    if (!notes.length){
      listEl.innerHTML = '<div class="notes-empty">아직 메모가 없어요. 아래 "+ 새 메모"로 첫 메모를 남겨보세요.</div>';
      return;
    }
    listEl.innerHTML = sortedNotes().map(n =>
      '<div class="note-row' + (n.completed ? ' completed' : '') + '" data-id="' + n.id + '">' +
        '<button class="note-todo' + (n.completed ? ' done' : '') + '" data-id="' + n.id + '" aria-label="완료 표시" type="button"></button>' +
        '<span class="n-main">' +
          '<span class="n-title">' + esc(n.title || '(제목 없음)') + '</span>' +
        '</span>' +
        '<span class="n-meta">' + fmtDate(n.updatedAt) + '</span>' +
      '</div>'
    ).join('');
  }

  // ---------------------------------------------------------------
  // 목록 클릭 — 동그라미(투두 토글)와 나머지 행(상세로 이동)을 구분해서 처리
  // ---------------------------------------------------------------
  listEl.addEventListener('click', (e) => {
    const todoBtn = e.target.closest('.note-todo');
    if (todoBtn){
      toggleCompleted(todoBtn.dataset.id);
      return;
    }
    const row = e.target.closest('.note-row');
    if (!row) return;
    const note = notes.find(n => n.id === row.dataset.id);
    if (note){ activeId = note.id; setMode('detail', note); }
  });

  btnNew.addEventListener('click', () => setMode('form', null));
  btnBack.addEventListener('click', () => setMode('list'));
  btnCancel.addEventListener('click', () => {
    const note = notes.find(n => n.id === activeId);
    setMode(note ? 'detail' : 'list', note);
  });
  btnEdit.addEventListener('click', () => {
    const note = notes.find(n => n.id === activeId);
    setMode('form', note);
  });

  // ---------------------------------------------------------------
  // 완료(투두) 토글 — 사용자 요청: "노트의 투두 리스트 기능이, 새로 고침을
  // 해야 체크 표시가 돼." 예전에는 GET(최신 확인)과 PUT(저장) 네트워크
  // 요청이 둘 다 끝난 뒤에야 renderList()를 불러서, 그 사이(특히 느린
  // 네트워크에서)에는 클릭해도 화면이 안 바뀐 것처럼 보였음 — 그래서 "새로
  // 고침해야 반영된다"고 느껴진 것.
  // 이제는 낙관적(optimistic) 업데이트로 바꿔서 클릭하는 즉시 로컬 notes
  // 배열을 뒤집고 renderList()로 화면부터 갱신한 다음, 그 상태 그대로
  // 백그라운드에서 저장을 시도한다 — 저장이 실패하면 원래대로 되돌리고
  // 화면도 다시 그린 뒤 알려준다.
  async function toggleCompleted(id){
    if (!GH_CFG) return;
    const btn = listEl.querySelector('.note-todo[data-id="' + id + '"]');
    if (btn) btn.disabled = true;

    const note = notes.find(n => n.id === id);
    if (!note){ if (btn) btn.disabled = false; return; }

    // 1) 화면부터 즉시 반영
    const prevCompleted = !!note.completed;
    note.completed = !prevCompleted;
    renderList();

    // 2) 그 상태를 백그라운드에서 저장
    try{
      const fresh = await GhApi.ghGetFile(GH_CFG, NOTES_PATH);
      const freshNotes = fresh ? JSON.parse(fresh.content || '[]') : [];
      notesSha = fresh ? fresh.sha : null;
      const freshNote = freshNotes.find(n => n.id === id);
      if (freshNote) freshNote.completed = !prevCompleted;
      const res = await GhApi.ghPutFile(GH_CFG, NOTES_PATH, JSON.stringify(freshNotes, null, 2) + '\n', 'Toggle note: ' + id, notesSha);
      notesSha = res && res.content ? res.content.sha : notesSha;
      notes = freshNotes;
      renderList();
    }catch(e){
      // 3) 저장 실패 — 화면을 원래 상태로 되돌림
      const stillHere = notes.find(n => n.id === id);
      if (stillHere) stillHere.completed = prevCompleted;
      renderList();
      alert('완료 표시를 저장하지 못했어요: ' + e.message);
    }finally{
      const btnAfter = listEl.querySelector('.note-todo[data-id="' + id + '"]');
      if (btnAfter) btnAfter.disabled = false;
    }
  }

  btnSave.addEventListener('click', async () => {
    if (!GH_CFG){ const rl = RetroLog.start(log, 'saving'); rl.fail('로그인 정보가 없어요. /private/ 에서 다시 인증해주세요.'); return; }
    const title = titleInput.value.trim();
    const body = bodyInput.value;
    if (!title){ const rl = RetroLog.start(log, 'saving'); rl.fail('제목을 입력해주세요.'); return; }

    btnSave.disabled = true;
    const rl = RetroLog.start(log, 'saving');
    try{
      const fresh = await GhApi.ghGetFile(GH_CFG, NOTES_PATH);
      notes = fresh ? JSON.parse(fresh.content || '[]') : [];
      notesSha = fresh ? fresh.sha : null;

      const now = new Date().toISOString();
      if (activeId){
        const idx = notes.findIndex(n => n.id === activeId);
        if (idx >= 0){
          notes[idx] = Object.assign({}, notes[idx], { title, body, updatedAt: now });
        } else {
          notes.push({ id: activeId, title, body, updatedAt: now });
        }
      } else {
        activeId = 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
        notes.push({ id: activeId, title, body, updatedAt: now, completed: false });
      }

      const res = await GhApi.ghPutFile(GH_CFG, NOTES_PATH, JSON.stringify(notes, null, 2) + '\n', 'Save note: ' + title, notesSha);
      notesSha = res && res.content ? res.content.sha : notesSha;
      rl.done();
      const saved = notes.find(n => n.id === activeId);
      setTimeout(() => setMode('detail', saved), 500);
    }catch(e){
      rl.fail(e.message);
    }finally{
      btnSave.disabled = false;
    }
  });

  btnDelete.addEventListener('click', async () => {
    if (!GH_CFG){ const rl = RetroLog.start(log, 'deleting'); rl.fail('로그인 정보가 없어요. /private/ 에서 다시 인증해주세요.'); return; }
    if (!activeId) return;
    if (!confirm('이 메모를 삭제할까요? 되돌릴 수 없어요.')) return;

    btnDelete.disabled = true;
    const rl = RetroLog.start(log, 'deleting');
    try{
      const fresh = await GhApi.ghGetFile(GH_CFG, NOTES_PATH);
      notes = fresh ? JSON.parse(fresh.content || '[]') : [];
      notesSha = fresh ? fresh.sha : null;
      notes = notes.filter(n => n.id !== activeId);

      const res = await GhApi.ghPutFile(GH_CFG, NOTES_PATH, JSON.stringify(notes, null, 2) + '\n', 'Delete note', notesSha);
      notesSha = res && res.content ? res.content.sha : notesSha;
      rl.done();
      setTimeout(() => setMode('list'), 500);
    }catch(e){
      rl.fail(e.message);
    }finally{
      btnDelete.disabled = false;
    }
  });

  (async function init(){
    if (!GH_CFG){
      listEl.innerHTML = '<div class="notes-empty">로그인 정보가 없어요. /private/ 에서 다시 인증해주세요.</div>';
      return;
    }
    try{
      const file = await GhApi.ghGetFile(GH_CFG, NOTES_PATH);
      notes = file ? JSON.parse(file.content || '[]') : [];
      notesSha = file ? file.sha : null;
      renderList();
    }catch(e){
      listEl.innerHTML = '<div class="notes-empty">목록을 불러오지 못했어요 — ' + esc(e.message) + '</div>';
    }
  })();
})();
</script>
</body>
</html>
